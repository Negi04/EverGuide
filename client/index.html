<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1c" />
    <script>
      // Pick the theme before the first paint, so a saved choice never flashes the other one.
      ;(function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('everguide-theme') === 'light') theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8fafc')
      })()
    </script>
    <meta
      name="description"
      content="EverGuide — AI-assisted career guidance with cited sources, verified mentorship, wellness and financial literacy in one place."
    />
    <title>EverGuide — Guidance for a Brighter Tomorrow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
